# Manual-only runs of the standalone AI-first pipeline
# (scripts/fetch-updates.mjs) — kept separate from ingest.yml (which feeds
# the live site's data/cards.json) since this is its own experiment with a
# different provider stack (Gemini/Groq) and hasn't been wired into the
# live site yet. workflow_dispatch only, no cron schedule — it never runs
# unless you trigger it from the Actions tab.
#
# Required, under Settings -> Secrets and variables -> Actions:
#   Secrets:
#     GEMINI_API_KEY   Free key at aistudio.google.com/apikey
#     GROQ_API_KEY     Free key at console.groq.com/keys
#   Variables (not sensitive):
#     AI_PROVIDER      Optional override for isolating one path:
#                       gemini | groq | rule-based. Leave unset (or blank)
#                       for the automatic fallback chain.
#
# Results aren't committed anywhere (this pipeline doesn't touch the live
# site's data) — read them from this run's console log (the full
# breakdown/summary prints at the end) or download the uploaded
# "fetch-updates-output" artifact from the run's summary page.

name: Fetch updates (standalone AI pipeline)

on:
  workflow_dispatch:
    inputs:
      ai_provider_override:
        description: "Force a single path (leave blank for automatic gemini -> groq -> rule-based fallback)"
        type: choice
        options: ["", "gemini", "groq", "rule-based"]
        default: ""

jobs:
  fetch-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fetch-updates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: ${{ inputs.ai_provider_override || vars.AI_PROVIDER }}
        run: pnpm fetch-updates

      - name: Upload output (published cards + QC log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-updates-output
          path: |
            data/fetch-updates-output.json
            data/fetch-updates-seen.json
          if-no-files-found: ignore
          retention-days: 14
