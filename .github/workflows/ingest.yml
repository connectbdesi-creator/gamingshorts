# Runs the RSS -> Ollama -> data/cards.json pipeline on a 2-hour cron,
# matching CLAUDE.md's baseline refresh cadence, and commits the result.
# That commit is what actually refreshes the site: it triggers Vercel's
# git-integration rebuild, which is required for any brand-new card slugs
# to get their own static /news/[slug] page (ISR's revalidate only
# refreshes pages that already exist from a prior build).
#
# Three jobs, split so classification can run in parallel across several
# runners instead of one runner working through every candidate serially
# (this used to take 25-40 minutes as a single job):
#   1. fetch            - fetches every RSS feed, writes the not-yet-seen
#                          candidate list as an artifact. No AI, no Ollama.
#   2. classify (matrix) - SHARD_COUNT parallel runners, each installs its
#                          own local Ollama, restores the shared model
#                          cache, and classifies/summarizes only its even
#                          slice of the candidates. Uploads its own partial
#                          results as an artifact.
#   3. merge-and-publish - downloads every shard's partial results, applies
#                          the rule-based clustering pass across the FULL
#                          merged set (a story split across two shards can
#                          only be caught once they're back together —
#                          clustering never runs on a single shard alone),
#                          writes the final data/*.json, and commits.
#
# Summarization/classification runs against each job's own local Ollama
# instance, installed and started below — no API key, no billing, no rate
# limit. Rule-based keyword classification (scripts/ingest/rule-based.ts)
# is only used as a fallback if Ollama itself fails to respond for a given
# call. AI-assisted clustering confirmation was removed (see dedup.ts) to
# cut AI calls per run — clustering is now purely rule-based
# (title-token overlap + game-tag agreement).
#
# GitHub's `schedule` trigger is explicitly best-effort — GitHub's own docs
# warn it "can be delayed during periods of high load." In practice this
# went further than delay: confirmed via the public Actions API that
# `schedule` stopped firing ENTIRELY for 11+ hours straight even with the
# */20 * * * * trigger below already live — not one run of any kind (queued,
# in progress, failed) in that whole window. A workflow file can't fix
# something upstream of itself, so the real fix is not depending on
# GitHub's scheduler at all: src/app/api/cron/dispatch-ingest is a Vercel
# API route that calls GitHub's REST API to fire workflow_dispatch
# directly, meant to be pinged every ~15-20 minutes by a genuinely
# reliable external cron (Vercel's own Cron Jobs only run once/day on the
# Hobby plan — too coarse — so a free service like cron-job.org is the
# default recommendation, not a paid upgrade). That external ping passes
# respect_cadence=true, which routes it through the SAME "Check if a run
# is due" gate below that a `schedule` event uses — the actual ~2-hour
# cadence logic didn't need to change, it just needed a reliable trigger
# regularly giving it a chance to run. The `schedule` trigger itself stays
# configured too, as a free second trigger source if GitHub's scheduler
# ever recovers on its own — redundant, not conflicting (the concurrency
# group below queues instead of racing if both happen to fire close
# together). A manual "Run workflow" click in the GitHub UI always runs
# immediately regardless of the last run's age (respect_cadence defaults
# to false there).
#
# Also added: a workflow-level `concurrency` group (a run that hangs — seen
# once, a workflow_dispatch that took 2h25m before failing — no longer
# risks a second run racing it on the final `git push`) and a
# `timeout-minutes` cap on every job so a hung run can't block the queue
# for hours in the first place.
#
# Event-aware refresh (CLAUDE.md's "denser cadence during showcase
# windows"): merge-and-publish.ts tracks recent runs' new-candidate volume
# in data/meta.json and flags a temporary denseModeUntil window when a run
# finds an unusual burst (see scripts/ingest/lib/event-detection.ts) —
# reacting to the actual evidence a Direct/State of Play/Summer Game Fest
# produces (many outlets filing at once) rather than a hardcoded events
# calendar that needs upkeep and still misses surprise announcements. The
# "Check if a run is due" step below uses a much shorter threshold while
# that window is active, so the standing ~2-hour cadence temporarily
# collapses to ~20 minutes with no manual intervention.
#
# Required, under Settings -> Secrets and variables -> Actions:
#   Secrets:
#     REVALIDATE_SECRET        Must match the app's REVALIDATE_SECRET env var.
#     SUPABASE_SERVICE_ROLE_KEY  Used to look up game_follows/push_subscriptions
#                                when sending push notifications. Optional —
#                                push sending is skipped without it.
#     VAPID_PRIVATE_KEY        Web Push signing key. Optional, same as above.
#     VAPID_SUBJECT            mailto: contact required by Web Push. Optional.
#     RAWG_API_KEY             rawg.io key for /game/[slug] info panels. Optional
#                               — that panel is just skipped without it.
#   Variables (not sensitive, so a repo Variable rather than a Secret):
#     SITE_URL                 Deployed site origin, e.g. https://gameshorts.example
#                               (matches the app's NEXT_PUBLIC_SITE_URL). Optional —
#                               the on-demand revalidate call is skipped without it.
#     NEXT_PUBLIC_SUPABASE_URL   Same value as the app's env var.
#     NEXT_PUBLIC_VAPID_PUBLIC_KEY  Same value as the app's env var.
#     NEXT_PUBLIC_GISCUS_REPO   Same value as the app's env var, e.g.
#                               owner/repo. Optional — comment count sync
#                               is skipped without it (counts just stay at
#                               their last-known value).
#     NEXT_PUBLIC_GISCUS_CATEGORY_ID  Same value as the app's env var.
#     OLLAMA_MODEL              Optional override, e.g. gemma2:2b for a
#                               smaller/faster model. Defaults to llama3.2:3b.

name: Ingest gaming news

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Reprocess all current feed items, ignoring dedup history (use after a showcase/event for a denser catch-up refresh)"
        type: boolean
        default: false
      respect_cadence:
        description: "Internal — set by the external cron pinger (src/app/api/cron/dispatch-ingest), not meant to be checked manually. Applies the same ~2-hour due-check a schedule trigger would, instead of always running immediately."
        type: boolean
        default: false

permissions:
  contents: write
  # Read-only access to this repo's own GitHub Discussions (the backing
  # store for Giscus comments) — used by the merge-and-publish job to sync
  # real comment counts back into data/cards.json (see
  # scripts/ingest/lib/comment-counts.ts). The automatic GITHUB_TOKEN
  # covers this; no secret to create.
  discussions: read

# A scheduled trigger that fires while a previous run is still going (a
# delayed trigger catching up, or a hung run — see the timeout-minutes
# below) now queues behind it instead of running concurrently and racing
# on the final `git push`.
concurrency:
  group: ingest-gaming-news
  cancel-in-progress: false

env:
  OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:3b' }}
  OLLAMA_MODELS: ${{ github.workspace }}/.ollama-models

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_due: ${{ steps.check.outputs.due }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cheap (checkout + a grep, no pnpm/Node setup needed), so running it
      # on every 20-minute trigger costs almost nothing — see the workflow
      # header comment for why this exists.
      - name: Check if a run is due
        id: check
        run: |
          # A manual "Run workflow" click (workflow_dispatch with
          # respect_cadence left at its default false) always runs
          # immediately — only `schedule` events and workflow_dispatch
          # calls that explicitly opt into cadence-respecting (the external
          # cron pinger at src/app/api/cron/dispatch-ingest, since GitHub's
          # own `schedule` event has been observed going completely silent
          # for 11+ hours at a stretch) go through the elapsed-time gate.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.respect_cadence }}" != "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger (respect_cadence not set) — running regardless of last run time."
            exit 0
          fi

          LAST_RUN=$(grep -oP '"lastRunAt":\s*"\K[^"]+' data/meta.json 2>/dev/null || echo "")
          if [ -z "$LAST_RUN" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "No previous run recorded (data/meta.json missing or unreadable) — running."
            exit 0
          fi

          LAST_EPOCH=$(date -d "$LAST_RUN" +%s)
          NOW_EPOCH=$(date -u +%s)
          ELAPSED_MIN=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))
          echo "Last real run: $LAST_RUN ($ELAPSED_MIN minute(s) ago)"

          # Event-aware refresh (scripts/ingest/lib/event-detection.ts):
          # merge-and-publish sets denseModeUntil when a run finds an
          # unusual burst of new RSS volume (a showcase/Direct-style spike),
          # instead of relying on a hardcoded events calendar. While that
          # window is still in the future, collapse the normal ~110-minute
          # gate down to the trigger interval itself, so the standing
          # ~2-hour cadence temporarily becomes ~20 minutes without any
          # change to this workflow file.
          THRESHOLD_MIN=110
          DENSE_UNTIL=$(grep -oP '"denseModeUntil":\s*"\K[^"]+' data/meta.json 2>/dev/null || echo "")
          if [ -n "$DENSE_UNTIL" ]; then
            DENSE_EPOCH=$(date -d "$DENSE_UNTIL" +%s 2>/dev/null || echo 0)
            if [ "$NOW_EPOCH" -lt "$DENSE_EPOCH" ]; then
              THRESHOLD_MIN=15
              echo "Event-aware dense mode active until $DENSE_UNTIL — using a ${THRESHOLD_MIN}-minute threshold."
            fi
          fi

          if [ "$ELAPSED_MIN" -ge "$THRESHOLD_MIN" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Not due yet (threshold ${THRESHOLD_MIN}min) — skipping this trigger, next check in ~20 minutes."
          fi

      - name: Setup pnpm
        if: steps.check.outputs.due == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.check.outputs.due == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.due == 'true'
        run: pnpm install --frozen-lockfile

      - name: Fetch RSS candidates
        if: steps.check.outputs.due == 'true'
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: npx tsx scripts/ingest/fetch-candidates.ts

      - name: Upload candidates
        if: steps.check.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: data-tmp/candidates.json
          retention-days: 1

  # 4 shards, evenly splitting the candidate list (see classify-shard.ts's
  # `i % SHARD_TOTAL === SHARD_INDEX`) — SHARD_TOTAL below must match the
  # length of this matrix array if either is ever changed.
  classify:
    needs: fetch
    if: needs.fetch.outputs.run_due == 'true'
    runs-on: ubuntu-latest
    # classify-shard.ts self-limits its own classify loop to 12 minutes
    # (see SHARD_DEADLINE_MS in lib/classify.ts) and always uploads
    # results after that, however far it got — this external cap only
    # exists as the last-resort backstop if setup itself hangs (Ollama
    # install/pull/server-start, observed to normally take ~1-1.5min), not
    # as the thing that's expected to fire in normal operation anymore.
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download candidates
        uses: actions/download-artifact@v4
        with:
          name: candidates
          path: data-tmp

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      # Shared across every shard (and the merge job below) via the same
      # cache key — only a genuinely cold cache (the very first run ever,
      # or after an OLLAMA_MODEL change) pulls the model more than once;
      # every run after that is a cache hit for all of them.
      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-models-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 1
          done

      - name: Pull Ollama model
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        run: ollama pull "$OLLAMA_MODEL"

      - name: Classify shard
        run: npx tsx scripts/ingest/classify-shard.ts

      - name: Upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: shard-results-${{ matrix.shard }}
          path: data-tmp/shard-${{ matrix.shard }}.json
          retention-days: 1

  merge-and-publish:
    needs: [fetch, classify]
    # needs.<job>.outputs is only visible to jobs that list <job> directly
    # in their own `needs` — classify alone wouldn't expose fetch's output,
    # hence depending on both. An explicit `if:` here also replaces the
    # default implicit `success()` check, so it has to be spelled out
    # (needs.classify.result == 'success') rather than assumed.
    if: needs.fetch.outputs.run_due == 'true' && needs.classify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download candidates
        uses: actions/download-artifact@v4
        with:
          name: candidates
          path: data-tmp

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: shard-results-*
          path: data-tmp
          merge-multiple: true

      # Needed here too: a cluster with more than one draft still calls
      # Ollama once (mergeArticles, see lib/cluster.ts) to write a single
      # combined summary — rare (most drafts are standalone stories) but
      # real, so this job needs a live Ollama instance same as the shards.
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-models-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 1
          done

      - name: Pull Ollama model
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        run: ollama pull "$OLLAMA_MODEL"

      - name: Merge shards, cluster, and publish
        env:
          # Used by getSiteUrl() (src/lib/site.ts) to build the URL inside
          # push notification payloads (scripts/ingest/push.ts) — without
          # this, it silently falls back to http://localhost:3000, since
          # this job never otherwise sees NEXT_PUBLIC_SITE_URL (only the
          # differently-named SITE_URL variable used by the revalidate
          # step below).
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          # Used by syncCommentCounts (scripts/ingest/lib/comment-counts.ts)
          # to pull real comment counts from this repo's own Discussions —
          # same values as Vercel's NEXT_PUBLIC_GISCUS_* vars. GITHUB_TOKEN
          # is provided automatically by Actions (see the discussions:read
          # permission above); no secret to create for it.
          NEXT_PUBLIC_GISCUS_REPO: ${{ vars.NEXT_PUBLIC_GISCUS_REPO }}
          NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/ingest/merge-and-publish.ts

      - name: Upload QC log (skipped articles + merged clusters + timing breakdown)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-log
          path: data/ingestion-log.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "gameshorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cards.json data/seen.json data/games.json data/meta.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: ingest gaming news [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger on-demand revalidation
        if: steps.commit.outputs.changed == 'true' && vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -sf -X POST "$SITE_URL/api/revalidate?secret=$REVALIDATE_SECRET" || \
            echo "Revalidate call failed (non-fatal) — the git push rebuild still covers this."
