# Runs the RSS -> Claude -> data/cards.json pipeline (scripts/ingest/run.ts)
# on a 2-hour cron, matching CLAUDE.md's baseline refresh cadence, and
# commits the result. That commit is what actually refreshes the site: it
# triggers Vercel's git-integration rebuild, which is required for any
# brand-new card slugs to get their own static /news/[slug] page (ISR's
# revalidate only refreshes pages that already exist from a prior build).
#
# Required, under Settings -> Secrets and variables -> Actions:
#   Secrets:
#     Set ONE of these two for summarization (OpenRouter is preferred if
#     both are set — see scripts/ingest/summarize.ts):
#       OPENROUTER_API_KEY     openrouter.ai key. Optionally pair with the
#                               OPENROUTER_MODEL variable below to pick a
#                               specific/cheaper model.
#       ANTHROPIC_API_KEY      Anthropic API key, used directly.
#     REVALIDATE_SECRET        Must match the app's REVALIDATE_SECRET env var.
#     SUPABASE_SERVICE_ROLE_KEY  Used to look up game_follows/push_subscriptions
#                                when sending push notifications. Optional —
#                                push sending is skipped without it.
#     VAPID_PRIVATE_KEY        Web Push signing key. Optional, same as above.
#     VAPID_SUBJECT            mailto: contact required by Web Push. Optional.
#   Variables (not sensitive, so a repo Variable rather than a Secret):
#     SITE_URL                 Deployed site origin, e.g. https://gameshorts.example
#                               (matches the app's NEXT_PUBLIC_SITE_URL). Optional —
#                               the on-demand revalidate call is skipped without it.
#     NEXT_PUBLIC_SUPABASE_URL   Same value as the app's env var.
#     NEXT_PUBLIC_VAPID_PUBLIC_KEY  Same value as the app's env var.
#     OPENROUTER_MODEL         Optional override, e.g. a free/cheaper model.
#     ANTHROPIC_MODEL          Optional override for the Anthropic path.

name: Ingest gaming news

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Reprocess all current feed items, ignoring dedup history (use after a showcase/event for a denser catch-up refresh)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingestion
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: pnpm ingest

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "gameshorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cards.json data/seen.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: ingest gaming news [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger on-demand revalidation
        if: steps.commit.outputs.changed == 'true' && vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -sf -X POST "$SITE_URL/api/revalidate?secret=$REVALIDATE_SECRET" || \
            echo "Revalidate call failed (non-fatal) — the git push rebuild still covers this."
